<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 酒馆 logo: 一个冒着热气的酒杯 -->
  <defs>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8a6030;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="steamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- 底座 -->
  <ellipse cx="50" cy="88" rx="28" ry="6" fill="#6a5020"/>
  <rect x="22" y="82" width="56" height="8" rx="4" fill="url(#cupGrad)"/>

  <!-- 杯身 -->
  <path d="M28,35 Q25,65 30,80 L70,80 Q75,65 72,35 Z" fill="url(#cupGrad)" opacity="0.9"/>

  <!-- 杯身高光 -->
  <path d="M32,38 Q30,60 33,75 L36,75 Q34,60 35,38 Z" fill="white" opacity="0.15"/>

  <!-- 杯口 -->
  <ellipse cx="50" cy="35" rx="22" ry="7" fill="#D4AF37"/>
  <ellipse cx="50" cy="33" rx="18" ry="5" fill="#2d1f10"/>

  <!-- 酒液 -->
  <ellipse cx="50" cy="36" rx="16" ry="4" fill="#8B4513" opacity="0.7"/>

  <!-- 把手 -->
  <path d="M72,42 Q88,42 88,55 Q88,68 72,68" fill="none" stroke="#D4AF37" stroke-width="5" stroke-linecap="round"/>

  <!-- 热气 (3条曲线) -->
  <path d="M40,28 Q38,20 42,14" fill="none" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="d" values="M40,28 Q38,20 42,14;M40,28 Q42,20 38,14;M40,28 Q38,20 42,14" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M50,25 Q48,17 52,11" fill="none" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="d" values="M50,25 Q48,17 52,11;M50,25 Q52,17 48,11;M50,25 Q48,17 52,11" dur="2.3s" repeatCount="indefinite"/>
  </path>
  <path d="M60,28 Q58,20 62,14" fill="none" stroke="url(#steamGrad)" stroke-width="2.5" stroke-linecap="round">
    <animate attributeName="d" values="M60,28 Q58,20 62,14;M60,28 Q62,20 58,14;M60,28 Q58,20 62,14" dur="1.8s" repeatCount="indefinite"/>
  </path>

  <!-- 星星装饰 -->
  <text x="18" y="50" font-size="8" fill="#D4AF37" opacity="0.6">✦</text>
  <text x="78" y="45" font-size="6" fill="#D4AF37" opacity="0.5">✦</text>
</svg>
